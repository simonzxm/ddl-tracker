name: DDLTracker
options:
  bundleIdPrefix: xyz.210023
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: zh-Hans
  xcodeVersion: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
packages:
  DDLTrackerClient:
    path: .
targets:
  DDLTracker:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: DDLTrackerClient
        product: DDLTrackerCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: DDL Tracker
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.productivity
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.210023.ddltracker
        PRODUCT_NAME: DDL Tracker
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
    scheme:
      testTargets: []
      gatherCoverageData: false
